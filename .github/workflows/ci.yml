name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    # Fork code must never receive the private source decryption key.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Unlock encrypted source
        env:
          SOURCE_KEY: ${{ secrets.GIT_CRYPT_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_KEY" ]; then
            echo 'GIT_CRYPT_KEY_BASE64 must be provisioned before source CI can run.' >&2
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y git-crypt
          key_file="$(mktemp)"
          chmod 600 "$key_file"
          trap 'rm -f "$key_file"; rm -rf .git/git-crypt' EXIT
          printf '%s' "$SOURCE_KEY" | base64 --decode > "$key_file"
          git-crypt unlock "$key_file"
      - name: Install test environment
        run: |
          python -m venv venv
          venv/bin/python -m pip install -e '.[dev]'
      - name: Full deterministic suite
        run: venv/bin/python -m pytest tests -q
      - name: Build wheel
        run: venv/bin/python -m pip wheel --no-deps --wheel-dir dist .
      - name: Clean wheel install and import smoke
        run: |
          python -m venv /tmp/ticker-wheel-smoke
          /tmp/ticker-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/ticker-wheel-smoke/bin/python -c 'import app, cli, app_ibkr, wire, backtest, catalyst, vecgrep_client; from pathlib import Path; assert (Path(app.__file__).parent / app.TickerApp.CSS_PATH).is_file()'
